org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
# Off in this repo, on in core. The Kotlin plugin cannot serialise its build
# service across the composite build that substitutes the local core
# checkout, and fails with an unreadable __buildFusService__ error. Losing a
# few seconds of configuration is worth a build that works from a fresh
# clone without anyone having to know that.
org.gradle.configuration-cache=false

# Never auto-download a JDK: a foojay.io outage must not break a build.
# Locally and in CI, JDK 21 is supplied by JAVA_HOME.
org.gradle.java.installations.auto-download=false

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx4g -XX:+UseParallelGC
kotlin.mpp.applyDefaultHierarchyTemplate=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Deliberately NOT setting android.newDsl=false / android.builtInKotlin=false.
# nomercy-app-kmp needs both because it uses `com.android.library` + androidTarget,
# and both flags are removed in AGP 10. This repo uses the KMP library plugin
# instead, which is the supported AGP 9 path and needs neither.

# --- Publishing coordinates (read by com.vanniktech.maven.publish) ---
GROUP=tv.nomercy
POM_ARTIFACT_ID=nomercy-music-player-kmp
# Contract-aligned rather than counted from zero: the major and minor track the
# web contract this implements, so 2.0.x implements web contract 2.0 and a
# consumer reading the version knows which surface they are getting.
VERSION_NAME=2.0.0-rc.1

# The published web-trio release whose contract this library implements. Read by
# `generateBuildInfo` into BuildInfo.CONTRACT_VERSION; P12 conformance asserts
# against it. When P30 vendors contract.json into the repo, this property is
# replaced by the JSON's own `version` field and the generator's input changes,
# not the public symbol.
CONTRACT_VERSION=2.0.4

POM_NAME=NoMercy Music Player (KMP)
POM_DESCRIPTION=The music half of the NoMercy player trio, for Kotlin Multiplatform.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/NoMercy-Entertainment/nomercy-music-player-kmp

POM_LICENSE_NAME=Apache-2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/NoMercy-Entertainment/nomercy-music-player-kmp
POM_SCM_CONNECTION=scm:git:git://github.com/NoMercy-Entertainment/nomercy-music-player-kmp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/NoMercy-Entertainment/nomercy-music-player-kmp.git

POM_DEVELOPER_ID=nomercy
POM_DEVELOPER_NAME=NoMercy Entertainment
POM_DEVELOPER_URL=https://github.com/NoMercy-Entertainment
