name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The payload download needs a token.
#
# Core's payloads come from release assets, and one of them -- libass -- lives
# in a private repository, so `gh release download` is an authenticated call.
# Only publish.yml ever set this, so the moment these jobs left GitHub's own
# runners they failed with gh's own advice: "set the GH_TOKEN environment
# variable".
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-music-player-kmp

      # Core is not on Maven Central yet, so the composite build is the only way
      # to resolve it. The relative path mirrors the monorepo, which is what
      # settings.gradle.kts looks for.
      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-player-core-kmp
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK, which a GitHub-hosted ubuntu image carried and a
      # self-hosted runner does not. Without it every Android target fails to
      # configure, and the message names a licence rather than a missing SDK.
      - uses: android-actions/setup-android@v3

      # The Gradle user home, kept between runs. On a persistent machine this
      # matters less than it did on a fresh VM, and it still keeps two repos'
      # builds from fighting over one unmanaged cache directory.
      - uses: gradle/actions/setup-gradle@v4

      # First, and on its own, because drift from the ecosystem contract is the
      # one failure whose cause is not in this repo's diff. Named, so a red run
      # says which question was answered no rather than burying it in a build
      # that takes ten minutes to reach the same conclusion.
      - name: Conformance gate
        working-directory: packages-native/nomercy-music-player-kmp
        run: ./gradlew parityConformance

      - name: Build
        working-directory: packages-native/nomercy-music-player-kmp
        run: ./gradlew build --stacktrace

      # The reports, always, because a failing test's cause does not survive the
      # console. Gradle prints the exception TYPE and the line it was thrown at
      # and stops there, so `UnsatisfiedLinkError at NativeLibraryLoader.java:205`
      # was the whole of what a red run said — a message that names a class and
      # not a reason, on a machine nobody can attach to. The XML carries the
      # message and the stack.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-music
          # Rooted at the WORKSPACE, not at the working directory the build step
          # used: the repo is checked out into a subdirectory here, and an
          # unrooted path uploads an empty artifact while reporting success.
          path: |
            packages-native/nomercy-music-player-kmp/build/reports/
            packages-native/nomercy-music-player-kmp/build/test-results/
            packages-native/nomercy-music-player-kmp/ui-compose/build/reports/
            packages-native/nomercy-music-player-kmp/ui-compose/build/test-results/
          retention-days: 7
