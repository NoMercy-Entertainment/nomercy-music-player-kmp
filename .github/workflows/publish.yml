name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# GH_TOKEN is set per step, only where gh runs (directly or from Gradle's payload
# download). The org PAT is needed because libass lives in another private repo;
# it falls back to the job token so a fork still builds what it can reach.

jobs:
  # macOS only, and not by preference. A multiplatform publication has to carry
  # every declared target, and the Apple frameworks can only be linked here.
  # Publishing from Linux would silently ship an artifact with no Apple variants.
  publish:
    # Hosted, like CI's apple job: the Mac mini has no tvOS simulator, and
    # core's v0.2.8 tag failed on :tvosSimulatorArm64Test there
    # (NoMercy-Entertainment/nomercy-github-runner#48).
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # A browser for the Kotlin/Wasm tests `build` runs through karma.
      #
      # Preferring one already installed, because the action's own download is
      # cached under the runner's tool directory and a half-written entry there
      # is reported as a cache HIT with no executable inside it. That is exactly
      # what happened: the third v0.1.0 attempt populated the cache, and the
      # fourth failed on "Unable to locate executable file ... /arm64/chrome"
      # before it reached a single build task.
      - name: Look for a browser already on this Mac
        id: local-chrome
        run: |
          set -e
          for candidate in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/Applications/Chromium.app/Contents/MacOS/Chromium"; do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "found $candidate"
              exit 0
            fi
          done
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "no browser in /Applications"

      # A cache entry with no browser in it is worse than none: the action trusts
      # it and skips the download. Removed here so the install below can succeed.
      - name: Drop a half-written browser cache
        if: steps.local-chrome.outputs.path == ''
        run: |
          root="${RUNNER_TOOL_CACHE:-$HOME/actions-runner/_work/_tool}/setup-chrome"
          [ -d "$root" ] || exit 0
          find "$root" -mindepth 2 -maxdepth 3 -type d | while read -r dir; do
            if [ ! -x "$dir/chrome" ] && [ ! -d "$dir/Chromium.app" ] && [ ! -d "$dir/Google Chrome.app" ]; then
              echo "removing incomplete $dir"
              rm -rf "$dir"
            fi
          done

      # v1 on purpose, not the v2 the Linux ci.yml uses. v2 hands this Mac
      # "Google Chrome for Testing" and karma then reports "ChromeHeadless has
      # not captured in 60000 ms" three times and gives up (v0.2.7 publish run
      # 36680268904, 2026-09-30). v1 installs Chromium, which captured for the
      # v0.2.6 publish here and for video's v0.2.7 publish the same morning.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        if: steps.local-chrome.outputs.path == ''

      - name: Point karma at that browser
        run: |
          bin="${{ steps.local-chrome.outputs.path }}"
          [ -n "$bin" ] || bin="${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"
          echo "karma will use: $bin"

      # The tag is the source of truth for what gets published. A tag that does
      # not match VERSION_NAME would publish a version nobody asked for, under a
      # name nobody can find.
      - name: Tag must match VERSION_NAME
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match VERSION_NAME=$declared" >&2
            exit 1
          fi

      # Gates first. A release that skips them is a release nothing checked.
      - run: ./gradlew build
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}

      # Stage every signed publication locally and attach its files to this
      # library's release. First, so repo.nomercy.tv gets the version even
      # when Central refuses it.
      - name: Attach Maven files to the GitHub release
        run: bash tools/release-maven.sh
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # repo.nomercy.tv lists a version in maven-metadata.xml only after
      # nomercy-packages rebuilds. Without this call the new version waits for
      # its 6-hour schedule, and a version range cannot resolve it until then.
      - name: Tell nomercy-packages to list the new version
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          for i in 1 2 3; do
            if curl -fsSL -X POST \
              -H "Authorization: Bearer ${PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/NoMercy-Entertainment/nomercy-packages/dispatches" \
              -d "{\"event_type\":\"release_published\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME}\"}}"; then
              echo "Triggered nomercy-packages update"
              exit 0
            fi
            echo "Dispatch attempt $i/3 failed"
            sleep 10
          done
          exit 1

      # Central caps free releases per month. The repo variable MAVEN_CENTRAL=off
      # skips it while repo.nomercy.tv still gets every version.
      - name: Publish to Maven Central
        if: vars.MAVEN_CENTRAL != 'off'
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

# The Apple half of this release is deliberately absent. The music library has no
# SwiftUI package yet, so there is no manifest to stamp a checksum into and no
# framework a consumer could resolve — a job that packaged one anyway would
# attach an asset nothing points at. It arrives with the package.
